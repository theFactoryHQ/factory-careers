name: Factory Careers Microsoft Credential Rotation

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: Apply changes if a credential is due or staged

permissions:
  contents: read
  id-token: write

concurrency:
  group: factory-careers-microsoft-rotation
  cancel-in-progress: false

jobs:
  rotate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.CAREERS_MICROSOFT_ROTATION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: careers-microsoft-rotation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: 1Password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: 2.41.1
      - name: Install rotation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check and rotate credentials
        env:
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          CAREERS_ROTATION_CLIENT_ID: ${{ vars.CAREERS_ROTATION_CLIENT_ID }}
          CAREERS_MICROSOFT_TENANT_ID: ${{ vars.CAREERS_MICROSOFT_TENANT_ID }}
          CAREERS_MICROSOFT_CLIENT_ID: ${{ vars.CAREERS_MICROSOFT_CLIENT_ID }}
          CAREERS_MICROSOFT_APPLICATION_OBJECT_ID: ${{ vars.CAREERS_MICROSOFT_APPLICATION_OBJECT_ID }}
          CAREERS_ROTATION_RENDER_SERVICE_ID: ${{ vars.CAREERS_ROTATION_RENDER_SERVICE_ID }}
          CAREERS_ROTATION_VAULT_ID: ${{ vars.CAREERS_ROTATION_VAULT_ID }}
          CAREERS_ROTATION_SSO_ITEM_ID: ${{ vars.CAREERS_ROTATION_SSO_ITEM_ID }}
          CAREERS_ROTATION_CALENDAR_ITEM_ID: ${{ vars.CAREERS_ROTATION_CALENDAR_ITEM_ID }}
          CAREERS_ROTATION_RENDER_API_KEY: ${{ secrets.CAREERS_ROTATION_RENDER_API_KEY }}
          CAREERS_ROTATION_OP_TOKEN: ${{ secrets.CAREERS_ROTATION_OP_TOKEN }}
        run: |
          mode=()
          if [[ "$APPLY" == true ]]; then mode+=(--apply); fi
          result=0
          CAREERS_ROTATION_ITEM_ID="$CAREERS_ROTATION_SSO_ITEM_ID" CAREERS_ROTATION_OTHER_ITEM_ID="$CAREERS_ROTATION_CALENDAR_ITEM_ID" node scripts/run-microsoft-rotation.mjs sso "${mode[@]}" || result=1
          CAREERS_ROTATION_ITEM_ID="$CAREERS_ROTATION_CALENDAR_ITEM_ID" CAREERS_ROTATION_OTHER_ITEM_ID="$CAREERS_ROTATION_SSO_ITEM_ID" node scripts/run-microsoft-rotation.mjs calendar "${mode[@]}" || result=1
          exit "$result"
