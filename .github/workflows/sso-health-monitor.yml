name: Factory Careers Microsoft Health Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: factory-careers-sso-health
  cancel-in-progress: false

jobs:
  probe:
    name: Probe Microsoft sign-in and calendar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FACTORY_CAREERS_PRODUCTION_URL: ${{ secrets.FACTORY_CAREERS_PRODUCTION_URL }}
      FACTORY_CAREERS_CRON_SECRET: ${{ secrets.FACTORY_CAREERS_CRON_SECRET }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Probe and reconcile Microsoft incidents
        uses: actions/github-script@v9
        with:
          script: |
            const { probeMonitorService, reconcileMonitorIssues } = await import(
              process.env.GITHUB_WORKSPACE + '/scripts/microsoft-monitor-incidents.mjs'
            )
            const base = process.env.FACTORY_CAREERS_PRODUCTION_URL
            const secret = process.env.FACTORY_CAREERS_CRON_SECRET
            if (!base || !secret) throw Error('Production monitor configuration is missing')
            const ready = await fetch(new URL('/api/operations/microsoft-notice', base), {
              method: 'POST', redirect: 'error', signal: AbortSignal.timeout(10_000),
            })
            const guard = await ready.json().catch(() => null)
            if (ready.status !== 403 || guard?.statusMessage !== 'Invalid cron secret') {
              throw Error('Waiting for the new notice endpoint to become live')
            }
            const results = await Promise.all(['sso', 'calendar'].map(async service => ({
              service, code: await probeMonitorService(base, secret, service),
            })))
            for (const { service, code } of results) core.info(service + ': ' + code)
            await reconcileMonitorIssues(github, context, results, { base, secret, warn: core.warning })
