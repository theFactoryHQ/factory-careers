name: Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: [self-hosted, macOS, ARM64, factory-careers]
    timeout-minutes: 10

    env:
      GITLEAKS_VERSION: 8.29.0

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          # Resolve the release asset for the current runner OS/arch so this works
          # on both GitHub-hosted Linux and the macOS ARM64 self-hosted runner.
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "$(uname -m)" in
            x86_64|amd64) arch="x64" ;;
            arm64|aarch64) arch="arm64" ;;
            *) echo "::error title=Unsupported architecture::$(uname -m)"; exit 1 ;;
          esac
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${os}_${arch}.tar.gz" \
            -o "${RUNNER_TEMP}/gitleaks.tar.gz"
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks-bin/gitleaks"
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" version

      - name: Scan relevant Git history
        env:
          PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          zero_sha="0000000000000000000000000000000000000000"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -n "${PULL_BASE_SHA}" && -n "${PULL_HEAD_SHA}" ]]; then
            log_opts="${PULL_BASE_SHA}..${PULL_HEAD_SHA}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${PUSH_BEFORE_SHA}" && "${PUSH_BEFORE_SHA}" != "${zero_sha}" ]]; then
            log_opts="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          else
            log_opts="${GITHUB_SHA}"
          fi

          echo "Scanning Git log range: ${log_opts}"
          gitleaks detect --source . --config .gitleaks.toml --redact --verbose --log-opts="${log_opts}"
